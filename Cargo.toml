[workspace]
resolver = "3"
members = ["crates/rustboy-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dudustri/rustboy-color"
authors = ["dudustri"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Debug builds of an emulator are ~20x too slow to hit 60 fps.
# Optimise dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 3
